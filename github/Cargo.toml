[package]
name = "github-function"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
flate2 = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subako-function-sdk = "0.2.1"
tar = { version = "0.4", default-features = false }

[profile.release]
opt-level = "s"
lto = true
strip = true
