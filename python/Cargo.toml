[package]
name = "python-function"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# SVG to PNG, for charts; text uses the bundled fonts, not system ones.
resvg = { version = "0.48.1", default-features = false, features = ["text", "raster-images"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subako-function-sdk = "0.2"

[profile.release]
opt-level = "s"
lto = true
