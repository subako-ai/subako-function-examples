[package]
name = "html-function"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Blitz, an HTML and CSS engine (Firefox's Stylo for CSS), drawn on the CPU.
anyrender = "0.14.0"
anyrender_vello_cpu = "0.18.0"
blitz-dom = { version = "=0.3.0-beta.3", default-features = false, features = ["svg", "woff"] }
blitz-html = { version = "=0.3.0-beta.3", default-features = false }
blitz-paint = { version = "=0.3.0-beta.3", default-features = false, features = ["svg"] }
blitz-traits = { version = "=0.3.0-beta.3", default-features = false }
data-url = "0.3.2"
parley = { version = "0.12", default-features = false, features = ["std"] }
peniko = "0.6.0"
png = "0.18"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Firefox's CSS engine, as Blitz uses it, for reading computed styles.
style = { package = "stylo", version = "0.22.0", default-features = false }
subako-function-sdk = "0.2.1"
# The fonts for SVG text, in the version blitz-dom uses.
usvg = { version = "0.48.1", default-features = false, features = ["text"] }

[patch.crates-io]
# With patches/blitz-dom-svg-fonts.patch applied, by fetch-deps.sh.
blitz-dom = { path = "vendor/blitz-dom" }

[profile.release]
opt-level = "s"
lto = true
strip = true
