[package]
name = "quickjs-function"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
rquickjs = { version = "0.14", features = ["loader"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subako-function-sdk = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
