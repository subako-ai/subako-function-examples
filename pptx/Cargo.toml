[package]
name = "pptx-function"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.22"
rquickjs = "0.14"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subako-function-sdk = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true

[dev-dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
