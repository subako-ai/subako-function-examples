[package]
name = "bashkit-function"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bashkit = { version = "0.18", default-features = false, features = ["jq"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subako-function-sdk = "0.2"
tokio = { version = "1", features = ["rt", "time"] }

[profile.release]
opt-level = "s"
lto = true
