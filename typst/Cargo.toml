[package]
name = "typst-function"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
flate2 = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subako-function-sdk = "0.2"
tar = { version = "0.4", default-features = false }
typst = "0.15.1"
typst-layout = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
typst-pdf = "0.15.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
